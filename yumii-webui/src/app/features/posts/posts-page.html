<h1>Posts</h1>

<form class="card form" (ngSubmit)="create()">
  <input name="title" placeholder="Title" [(ngModel)]="title" required />
  <textarea name="content" placeholder="Content" rows="3" [(ngModel)]="content"></textarea>
  <button type="submit">Add post</button>
</form>

@if (error(); as message) {
  <p class="error">{{ message }}</p>
}

@for (post of posts(); track post.id) {
  <article class="card">
    <h2>{{ post.title }}</h2>
    <p>{{ post.content }}</p>
    <small>{{ post.createdAt | date: 'short' }}</small>
  </article>
} @empty {
  <p class="muted">No posts yet.</p>
}
